name: GitHub Local Environment Test Deployment

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

jobs:
  test-environment-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Validate Database Initialization Schema
        run: |
          python -m app.db
          if [ ! -f "data/jobs.db" ]; then
            echo "Error: SQLite jobs.db matrix failed to build."
            exit 1
          fi
          echo "Database schema built successfully on runner."

      - name: Run E2E Integration and Compilation Test
        run: |
          python -c '
          import subprocess
          import socket
          import time
          import sys
          import os

          # 1. Inline Mock FastAPI code written cleanly to a temporary script
          mock_code = """
          from fastapi import FastAPI
          import uvicorn
          app = FastAPI()
          @app.post("/v1/chat/completions")
          def mock_completions(payload: dict = None):
              return {
                  "choices": [{
                      "message": {
                          "content": "{\\"summary\\": \\"Mocked summary matching the JD\\", \\"experience\\": [], \\"skills\\": []}"
                      }
                  }]
              }
          if __name__ == "__main__":
              uvicorn.run(app, host="127.0.0.1", port=11434)
          """
          with open("mock_server.py", "w") as f:
              f.write(mock_code.strip())

          # 2. Spawn mock server as a strict managed child process
          print("Spawning managed Mock Ollama API process...")
          server_proc = subprocess.Popen([sys.executable, "mock_server.py"])

          # 3. Block and poll until the port is definitively open
          print("Polling 127.0.0.1:11434 for socket initialization...")
          connected = False
          for i in range(15):
              try:
                  with socket.create_connection(("127.0.0.1", 11434), timeout=1):
                      print("Socket interface confirmed active and reachable on port 11434!")
                      connected = True
                      break
              except OSError:
                  print(f"Port 11434 not listening yet... ({i+1}/15)")
                  time.sleep(1)

          if not connected:
              print("Error: Mock server socket failed to bind.")
              server_proc.terminate()
              sys.exit(1)

          # 4. Run the worker script synchronously within the exact same process allocation window
          print("Executing worker logic synchronously...")
          worker_res = subprocess.run([sys.executable, "-m", "app.worker"])

          # 5. Clean up the server process safely
          server_proc.terminate()
          server_proc.wait()

          # 6. Bubble up worker exit codes straight to the GitHub runner
          if worker_res.returncode != 0:
              sys.exit(worker_res.returncode)
          '
          
          # 7. Final assertions checking file system output layers
          if [ ! -d "data/output" ]; then
            echo "Error: Output directory matrix missing."
            exit 1
          fi
          echo "E2E testing phase completed with 100% compilation integrity."
