name: GitHub Local Environment Test Deployment

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

jobs:
  test-environment-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Validate Database Initialization Schema
        run: |
          python -m app.db
          if [ ! -f "data/jobs.db" ]; then
            echo "Error: SQLite jobs.db matrix failed to build."
            exit 1
          fi
          echo "Database schema built successfully on runner."

      - name: Run E2E Integration and Compilation Test
        run: |
          # 1. Start the Mock Server directly inside this step's environment execution path
          python -c '
          from fastapi import FastAPI
          import uvicorn
          app = FastAPI()
          @app.post("/v1/chat/completions")
          def mock_completions(payload: dict = None):
              return {
                  "choices": [{
                      "message": {
                          "content": "{\"summary\": \"Mocked summary matching the JD\", \"experience\": [], \"skills\": []}"
                      }
                  }]
              }
          uvicorn.run(app, host="127.0.0.1", port=11434)
          ' &
          
          # 2. Wait explicitly for the port listener layer to become active
          echo "Verifying local mock LLM port listener is completely initialized..."
          for i in {1..15}; do
            if nc -z 127.0.0.1 11434; then
              echo "Mock Ollama API is live and listening on port 11434!"
              break
            fi
            echo "Waiting for mock server to bind... ($i/15)"
            sleep 1
            if [ $i -eq 15 ]; then
              echo "Error: Mock server failed to initialize in time."
              exit 1
            fi
          done
          
          # 3. Execute the worker directly while the background service is guaranteed alive
          python -m app.worker
          
          # 4. Verify artifact outputs exist safely
          if [ ! -d "data/output" ]; then
            echo "Error: Output directory matrix missing."
            exit 1
          fi
          echo "E2E testing phase completed with 100% compilation integrity."
