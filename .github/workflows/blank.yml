name: GitHub Local Environment Test Deployment

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

jobs:
  test-environment-deployment:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Validate Database Initialization Schema
        run: |
          python -m app.db
          if [ ! -f "data/jobs.db" ]; then
            echo "Error: SQLite jobs.db matrix failed to build."
            exit 1
          fi
          echo "Database schema built successfully on runner."

      - name: Start Mock Ollama Local Service API
        run: |
          python -c '
          from fastapi import FastAPI
          import uvicorn
          app = FastAPI()
          @app.post("/v1/chat/completions")
          def mock_completions(payload: dict = None):
              return {
                  "choices": [{
                      "message": {
                          "content": "{\"summary\": \"Mocked summary matching the JD\", \"experience\": [], \"skills\": []}"
                      }
                  }]
              }
          uvicorn.run(app, host="127.0.0.1", port=11434)
          ' &
          echo "Waiting for simulated local LLM infrastructure to stabilize..."
          sleep 5

      - name: Run E2E Integration and Compilation Test
        run: |
          python -m app.worker
          
          if [ ! -d "data/output" ]; then
            echo "Error: Output directory matrix missing."
            exit 1
          fi
          echo "E2E testing phase completed with 100% compilation integrity."
